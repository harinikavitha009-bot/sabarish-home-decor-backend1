spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/home_decor_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD}

server:
  port: 8081